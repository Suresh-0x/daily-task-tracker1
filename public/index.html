<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <!-- Auth Screen (Shown when logged out) -->
  <div id="authScreen" class="max-w-md mx-auto my-16 bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-900">Task Tracker</h1>
      <p class="text-sm text-slate-500 mt-1" id="authSubtitle">Sign in to manage your private tasks</p>
    </div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
        <input 
          type="email" 
          id="authEmail" 
          required 
          placeholder="you@example.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
        />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
        <input 
          type="password" 
          id="authPassword" 
          required 
          minlength="6"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
        />
      </div>

      <div id="authError" class="text-xs text-rose-600 font-medium hidden"></div>

      <button 
        type="submit" 
        id="authSubmitBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition"
      >
        Sign In
      </button>
    </form>

    <div class="text-center text-xs text-slate-500">
      <span id="authTogglePrompt">Don't have an account?</span>
      <button id="authToggleBtn" class="text-indigo-600 font-semibold hover:underline ml-1">Sign Up</button>
    </div>
  </div>

  <!-- App Main Screen (Shown when logged in) -->
  <div id="appScreen" class="hidden max-w-3xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Task Tracker</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <p class="text-xs text-slate-500 font-medium" id="currentDateDisplay"></p>
          <span class="text-xs text-slate-300">•</span>
          <span class="text-xs font-semibold text-indigo-600" id="userEmailBadge"></span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="viewTrackerBtn" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition">Today</button>
        <button id="viewHistoryBtn" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition">History</button>
        <button id="logoutBtn" class="px-3 py-2 text-sm font-semibold rounded-lg text-rose-600 hover:bg-rose-50 transition border border-rose-200">Logout</button>
      </div>
    </header>

    <!-- Daily Tracker View -->
    <main id="trackerView" class="space-y-6">
      <!-- Input -->
      <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <form id="taskForm" class="flex gap-3">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="Add a new task..." 
            class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            required
          />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
            Add
          </button>
        </form>
      </section>

      <!-- Active Tasks -->
      <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-slate-800">Today's Tasks</h2>
          <button id="archiveDayBtn" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold transition">
            Close Day & Archive
          </button>
        </div>
        <ul id="taskList" class="space-y-2"></ul>
      </section>

      <!-- Bin (Uncompleted) -->
      <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-rose-700 mb-4">Bin (Uncompleted)</h2>
        <ul id="binList" class="space-y-2"></ul>
      </section>
    </main>

    <!-- History View -->
    <main id="historyView" class="hidden space-y-6">
      <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
          <h2 class="font-bold text-slate-800">History Records</h2>
          <button id="clearHistoryBtn" class="text-xs text-rose-600 hover:underline font-semibold">Clear All History</button>
        </div>
        <div id="historyContainer" class="space-y-4"></div>
      </section>
    </main>

  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = 'https://ahajtqvcxykqxryujosk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3rdqk0bmNGcR-sZpuGuqLw_JrzmF-tI'; // Replace with your anon key
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let isSignUpMode = false;
    let activeTasks = [];

    // DOM Elements
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const authForm = document.getElementById('authForm');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authToggleBtn = document.getElementById('authToggleBtn');
    const authTogglePrompt = document.getElementById('authTogglePrompt');
    const authSubtitle = document.getElementById('authSubtitle');
    const authError = document.getElementById('authError');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmailBadge = document.getElementById('userEmailBadge');

    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const binList = document.getElementById('binList');
    const archiveDayBtn = document.getElementById('archiveDayBtn');
    const historyContainer = document.getElementById('historyContainer');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const viewTrackerBtn = document.getElementById('viewTrackerBtn');
    const viewHistoryBtn = document.getElementById('viewHistoryBtn');
    const trackerView = document.getElementById('trackerView');
    const historyView = document.getElementById('historyView');
    const currentDateDisplay = document.getElementById('currentDateDisplay');

    currentDateDisplay.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
    });

    // 2. Auth Mode Toggle (Sign In vs Sign Up)
    authToggleBtn.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      authError.classList.add('hidden');
      if (isSignUpMode) {
        authSubtitle.textContent = 'Create your account to track your private tasks';
        authSubmitBtn.textContent = 'Create Account';
        authTogglePrompt.textContent = 'Already have an account?';
        authToggleBtn.textContent = 'Sign In';
      } else {
        authSubtitle.textContent = 'Sign in to manage your private tasks';
        authSubmitBtn.textContent = 'Sign In';
        authTogglePrompt.textContent = "Don't have an account?";
        authToggleBtn.textContent = 'Sign Up';
      }
    });

    // 3. Auth Form Submission
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = authEmail.value.trim();
      const password = authPassword.value;

      try {
        if (isSignUpMode) {
          const { data, error } = await db.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) {
            handleSession(data.session);
          } else {
            alert('Account created successfully! You can now sign in.');
            authToggleBtn.click();
          }
        } else {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          handleSession(data.session);
        }
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove('hidden');
      }
    });

    // 4. Logout
    logoutBtn.addEventListener('click', async () => {
      await db.auth.signOut();
      currentUser = null;
      appScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
    });

    // 5. Session Listener & Initial Check
    function handleSession(session) {
      if (session && session.user) {
        currentUser = session.user;
        userEmailBadge.textContent = currentUser.email;
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadTasks();
      } else {
        currentUser = null;
        appScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
      }
    }

    db.auth.getSession().then(({ data: { session } }) => {
      handleSession(session);
    });

    db.auth.onAuthStateChange((_event, session) => {
      handleSession(session);
    });

    // 6. Task Management (User Specific via Supabase RLS)
    async function loadTasks() {
      if (!currentUser) return;
      const { data, error } = await db
        .from('active_tasks')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('Error fetching tasks:', error);
        return;
      }

      activeTasks = (data || []).map(r => ({
        id: r.id,
        text: r.text,
        completed: Boolean(r.completed),
        inBin: Boolean(r.in_bin)
      }));
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = '';
      binList.innerHTML = '';

      const live = activeTasks.filter(t => !t.inBin);
      const binned = activeTasks.filter(t => t.inBin);

      if (live.length === 0) {
        taskList.innerHTML = '<li class="text-slate-400 text-sm italic">No active tasks.</li>';
      } else {
        live.forEach(task => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between p-3 rounded-lg border border-slate-100 hover:bg-slate-50 transition';
          li.innerHTML = `
            <label class="flex items-center gap-3 cursor-pointer flex-1">
              <input type="checkbox" ${task.completed ? 'checked' : ''} class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500" />
              <span class="${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} text-sm font-medium">${task.text}</span>
            </label>
            <button class="binBtn text-xs text-rose-500 hover:text-rose-700 font-semibold px-2 py-1">Move to Bin</button>
          `;

          // Tick checkbox
          li.querySelector('input').addEventListener('change', async (e) => {
            await db
              .from('active_tasks')
              .update({ completed: e.target.checked })
              .eq('id', task.id);
            loadTasks();
          });

          // Move to bin
          li.querySelector('.binBtn').addEventListener('click', async () => {
            await db
              .from('active_tasks')
              .update({ in_bin: true, completed: false })
              .eq('id', task.id);
            loadTasks();
          });

          taskList.appendChild(li);
        });
      }

      if (binned.length === 0) {
        binList.innerHTML = '<li class="text-slate-400 text-sm italic">Bin is empty.</li>';
      } else {
        binned.forEach(task => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between p-3 rounded-lg bg-rose-50 border border-rose-100 text-sm text-rose-800';
          li.innerHTML = `
            <span class="line-through">${task.text}</span>
            <button class="restoreBtn text-xs text-indigo-600 hover:underline font-semibold">Restore</button>
          `;

          li.querySelector('.restoreBtn').addEventListener('click', async () => {
            await db
              .from('active_tasks')
              .update({ in_bin: false })
              .eq('id', task.id);
            loadTasks();
          });

          binList.appendChild(li);
        });
      }
    }

    // Add Task
    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text || !currentUser) return;

      const { error } = await db
        .from('active_tasks')
        .insert([{ 
          text: text, 
          completed: false, 
          in_bin: false, 
          user_id: currentUser.id 
        }]);

      if (error) {
        alert('Error adding task: ' + error.message);
        return;
      }

      taskInput.value = '';
      loadTasks();
    });

    // Close Day & Archive
    archiveDayBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      if (activeTasks.length === 0) return alert('No tasks to archive.');
      if (!confirm("Save today's completed and uncompleted tasks into history?")) return;

      const completed = activeTasks.filter(t => t.completed).map(t => t.text);
      const uncompleted = activeTasks.filter(t => !t.completed).map(t => t.text);
      const todayStr = new Date().toISOString().split('T')[0];

      const { error: insertErr } = await db
        .from('history_records')
        .insert([{
          date: todayStr,
          completed_tasks: completed,
          uncompleted_tasks: uncompleted,
          user_id: currentUser.id
        }]);

      if (insertErr) {
        alert('Archive failed: ' + insertErr.message);
        return;
      }

      // Delete only current user's active tasks
      await db
        .from('active_tasks')
        .delete()
        .eq('user_id', currentUser.id);

      loadTasks();
      alert('Archived successfully!');
    });

    // History View
    async function loadHistory() {
      if (!currentUser) return;
      const { data, error } = await db
        .from('history_records')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error fetching history:', error);
        return;
      }

      historyContainer.innerHTML = '';

      if (!data || data.length === 0) {
        historyContainer.innerHTML = '<p class="text-sm text-slate-400 italic">No history records found.</p>';
        return;
      }

      data.forEach(day => {
        const card = document.createElement('div');
        card.className = 'p-5 rounded-xl border border-slate-200 bg-slate-50 space-y-3';
        
        const completedMarkup = day.completed_tasks && day.completed_tasks.length
          ? day.completed_tasks.map(t => `<li class="text-xs text-emerald-700 font-medium">✓ ${t}</li>`).join('')
          : '<li class="text-xs text-slate-400 italic">None</li>';

        const uncompletedMarkup = day.uncompleted_tasks && day.uncompleted_tasks.length
          ? day.uncompleted_tasks.map(t => `<li class="text-xs text-rose-600 font-medium">✕ ${t}</li>`).join('')
          : '<li class="text-xs text-slate-400 italic">None</li>';

        card.innerHTML = `
          <div class="font-bold text-sm text-slate-900 border-b border-slate-200 pb-2 flex justify-between">
            <span>Date: ${day.date}</span>
            <span class="text-xs text-slate-500 font-normal">${(day.completed_tasks || []).length} completed / ${(day.uncompleted_tasks || []).length} uncompleted</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
            <div>
              <p class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-2">Completed</p>
              <ul class="space-y-1">${completedMarkup}</ul>
            </div>
            <div>
              <p class="text-xs font-bold text-rose-800 uppercase tracking-wider mb-2">Uncompleted (Bin)</p>
              <ul class="space-y-1">${uncompletedMarkup}</ul>
            </div>
          </div>
        `;
        historyContainer.appendChild(card);
      });
    }

    clearHistoryBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      if (confirm('Delete all your history records?')) {
        await db
          .from('history_records')
          .delete()
          .eq('user_id', currentUser.id);
        loadHistory();
      }
    });

    viewTrackerBtn.addEventListener('click', () => {
      trackerView.classList.remove('hidden');
      historyView.classList.add('hidden');
      viewTrackerBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition';
      viewHistoryBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      loadTasks();
    });

    viewHistoryBtn.addEventListener('click', () => {
      historyView.classList.remove('hidden');
      trackerView.classList.add('hidden');
      viewHistoryBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition';
      viewTrackerBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
      loadHistory();
    });
  </script>
</body>
</html>
